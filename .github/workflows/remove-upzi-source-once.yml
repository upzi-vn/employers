name: Remove homepage source note once

on:
  push:
    paths:
      - '.github/workflows/remove-upzi-source-once.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove source note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = '      <p class="band-src reveal">Nguồn: Số liệu nội bộ Upzi.</p>\n'
          if target not in s:
              raise SystemExit('Target source note not found')
          p.write_text(s.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "upzi-vn"
          git config user.email "dung.vt@navigosgroup.com"
          git add index.html
          git commit -m "Remove internal data source note from homepage"
          git push origin main
